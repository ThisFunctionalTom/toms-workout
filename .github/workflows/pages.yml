name: Refresh progress and upload Garmin workout

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      initialize_from_latest:
        description: "After checking Garmin Connect for duplicates, upload only the newest Liftosaur workout to establish its marker"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Check shared logic and API scripts
        run: |
          dotnet fsi conversion.tests.fsx
          dotnet fsi liftosaur.tests.fsx
          dotnet fsi syncPrograms.tests.fsx
      - name: Refresh workout summary
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          LIFTOSAUR_API_KEY: ${{ secrets.LIFTOSAUR_API_KEY }}
        run: |
          if [ -z "$LIFTOSAUR_API_KEY" ]; then
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              echo "::error::Add LIFTOSAUR_API_KEY under repository Settings > Secrets and variables > Actions."
              exit 1
            fi
            echo "::warning::LIFTOSAUR_API_KEY is not configured; building with the checked-in summary."
          else
            dotnet fsi progress/generate.fsx
          fi
      - name: Require workout upload credentials
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          LIFTOSAUR_API_KEY: ${{ secrets.LIFTOSAUR_API_KEY }}
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: |
          if [ -z "$LIFTOSAUR_API_KEY" ]; then
            echo "::error::Add LIFTOSAUR_API_KEY under repository Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [ -z "$GARMIN_EMAIL" ] || [ -z "$GARMIN_PASSWORD" ]; then
            echo "::error::Add GARMIN_EMAIL and GARMIN_PASSWORD under repository Settings > Secrets and variables > Actions."
            exit 1
          fi
      - name: Generate recent workout FIT files
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          LIFTOSAUR_API_KEY: ${{ secrets.LIFTOSAUR_API_KEY }}
        run: dotnet fsi liftosaur2garmin.fsx -- 200 ./fit
      - name: Set up Python for Garmin upload
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install Garmin Connect uploader
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: python -m pip install --disable-pip-version-check "garminconnect==0.3.19" "curl_cffi"
      - name: Upload new workouts to Garmin Connect
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: |
          args=()
          if [ "${{ inputs.initialize_from_latest }}" = "true" ]; then
            args+=(--initialize-from-latest)
          fi
          python scripts/upload_latest_garmin.py ./fit "${args[@]}"
      - name: Upload static site
        if: vars.PAGES_ENABLED == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: progress/site

  deploy:
    if: vars.PAGES_ENABLED == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy training progress page
        id: deployment
        uses: actions/deploy-pages@v4
